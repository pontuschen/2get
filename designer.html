
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>設計師作品</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 1rem; }
    .card { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; border-radius: 8px; }
    .card img { max-width: 100%; border-radius: 6px; }
    .desc { color: #444; }
  </style>
</head>
<body>
  <h1 id="title">設計師投稿</h1>
  <div id="gallery"></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqMfXPUaks_xU-X7an8KOn47B79sw9W8I",
      authDomain: "the2get.firebaseapp.com",
      projectId: "the2get",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const params = new URLSearchParams(window.location.search);
    const designer = params.get("name");
    document.getElementById("title").textContent = `👤 ${designer} 的投稿`;
    db.collection("posts").where("designer", "==", designer)
      .orderBy("timestamp", "desc").get().then(snapshot => {
        const container = document.getElementById("gallery");
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `<div class="desc">${data.description}</div><img src="${data.imageUrl}" />`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
