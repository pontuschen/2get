
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>設計師圖文平台</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 1rem; }
    input, button { margin: 0.5rem 0; width: 100%; }
    .card { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; border-radius: 8px; }
    .card img { max-width: 100%; border-radius: 6px; }
    .designer { font-weight: bold; margin-bottom: 0.2rem; }
    .desc { color: #444; }
    .link { color: blue; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🎨 設計師投稿平台</h1>
  <input type="text" id="designer" placeholder="設計師名稱">
  <input type="text" id="description" placeholder="作品說明">
  <input type="file" id="imageInput">
  <button onclick="upload()">上傳</button>
  <div id="output"></div>
  <h2>🖼️ 最新投稿</h2>
  <div id="gallery"></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="main.js"></script>
</body>
</html>
