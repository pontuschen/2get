<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>設計師圖文平台</title>
  <!-- Firebase CDN (compat 版本，支援 browser 使用 firebase.XXX) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="main.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>🖼️ 上傳作品</h2>
  <form id="uploadForm">
    <input type="text" id="designerName" placeholder="設計師名稱" required><br>
    <textarea id="description" placeholder="作品說明..." required></textarea><br>
    <input type="file" id="imageInput" accept="image/*" required><br>
    <button type="submit">上傳</button>
  </form>

  <h1>🎨 最新投稿</h1>
  <div id="designerList"></div>
  <div id="postList"></div>
</body>
</html>
