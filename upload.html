<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>上傳作品</title>
  <script src="firebaseConfig.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js"></script>
  <script src="upload.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>🖼️ 上傳作品</h2>
  <form id="uploadForm">
    <input type="text" id="designerName" placeholder="設計師名稱" required><br>
    <textarea id="description" placeholder="作品說明..." required></textarea><br>
    <input type="file" id="imageInput" accept="image/*" required><br>
    <button type="submit">上傳</button>
  </form>
</body>
</html>
